name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: SemVer v tag to embed in release binaries; empty for development builds
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Let trusted pushes finish publication. A canceled upload remains a draft;
  # PR and manual checks can still supersede older checks.
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  version:
    name: Validate build version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate build identity
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python3 scripts/release/identity.py

  checks:
    name: Workflow and secret checks
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Validate GitHub workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Scan Git history for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git . --redact --no-banner --log-opts="--all"
      - name: Test release publication boundaries
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v

  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check Go formatting
        run: |
          mapfile -d '' files < <(git ls-files -z '*.go')
          unformatted=$(gofmt -l "${files[@]}")
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet Go packages
        run: go vet ./...
      - name: Test Go packages
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # Package-level concurrency can starve bounded PowerShell startups.
            go test -p 1 -count=1 -timeout 5m ./...
          else
            go test -count=1 -timeout 5m ./...
          fi

  pi:
    name: Pi extension (Node 24)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: integrations/pi
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: integrations/pi/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit development dependencies
        run: npm audit --audit-level=high
      - name: Check TypeScript
        run: npm run check
      - name: Test pi extension
        run: npm test

  artifacts:
    name: Build release archives
    needs: [version, checks, go, pi]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build and package three supported targets
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python3 scripts/release/package.py build
      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish-main:
    name: Publish main build
    needs: [version, artifacts]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'dominic-codespoti/messh' &&
      github.workflow_ref == 'dominic-codespoti/messh/.github/workflows/ci.yml@refs/heads/main' &&
      needs.version.outputs.channel == 'main'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml

  publish-tag:
    name: Publish tagged release
    needs: [version, artifacts]
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      github.repository == 'dominic-codespoti/messh' &&
      github.workflow_ref == format('dominic-codespoti/messh/.github/workflows/ci.yml@{0}', github.ref) &&
      needs.version.outputs.channel == 'stable'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      release-tag: ${{ needs.version.outputs.tag }}
